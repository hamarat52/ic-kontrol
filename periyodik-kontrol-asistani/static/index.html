<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>Periyodik Kontrol Asistanı</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>" />
<link rel="stylesheet" href="/static/style.css?v=1792314135" />
</head>
<body>
<div class="win" id="win">

  <aside class="side">
    <button class="search" id="searchBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      Ara<kbd>⌘K</kbd>
    </button>

    <nav id="nav">
      <button class="nav-item" data-route="belgeler"><span class="ico">📄</span><span class="label">Belgeler</span><span class="count" id="cDocs"></span></button>
      <button class="nav-item" data-route="kutuphane"><span class="ico">📚</span><span class="label">Kontroller</span><span class="count" id="cLib"></span></button>
      <button class="nav-item" data-route="bilgi"><span class="ico">💡</span><span class="label">Öğrenilenler</span><span class="pend-dot" id="cLearn" hidden></span></button>
    </nav>

    <div class="sec" id="secSets">
      <button class="sec-head" id="secToggle">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        Kontrol Setleri<span class="sec-count" id="cSets"></span>
      </button>
      <div class="sec-body" id="setList"></div>
    </div>

    <div class="side-foot">
      <button class="new-btn" id="newSetBtn"><span class="ico">＋</span>Yeni kontrol seti</button>
      <button class="user" id="userBtn">
        <div class="avatar">Y</div>
        <div>Yusuf<small id="modelLine"><span class="dot"></span>model kontrol ediliyor…</small></div>
      </button>
    </div>
  </aside>

  <section class="main">
    <div class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="actions" id="actions"></div>
    </div>
    <div class="scroll" id="scroll"><div class="doc" id="view"></div></div>

    <div class="ask-wrap">
      <div class="ask" id="ask" hidden>
        <button class="ask-bar" id="askBar">
          <span class="orb"></span>
          <span class="ph" id="askPh">Bu kontrol setine sor ya da geri bildirim ver…</span>
          <kbd class="k">⌘J</kbd>
        </button>
      </div>
      <div class="bulk" id="bulk" hidden></div>
    </div>
  </section>

  <aside class="panel">
    <div class="panel-in" id="panel"></div>
  </aside>
</div>

<input type="file" id="fileInput" accept=".pdf,.docx,.xlsx,.txt,.md" multiple hidden />
<div class="toast" id="toast"></div>
<div class="undo" id="undo" hidden></div>
<script src="/static/app.js?v=1792314135"></script>
</body>
</html>
